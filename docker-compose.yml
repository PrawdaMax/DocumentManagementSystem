services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    env_file: .env
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management-UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build: ./paperless-rest
    env_file: .env
    environment:
      DB_HOST: db
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./paperless-frontend
    ports:
      - "80:80"
    depends_on:
      - rest

  ocr-worker:
    build: ./paperless-ocr-worker
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq-data:
