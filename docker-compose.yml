services:
  db:
    image: postgres:18-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    build: ./paperless-rest
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./paperless-frontend
    ports:
      - "80:80"
    depends_on:
      - rest

volumes:
  pgdata: