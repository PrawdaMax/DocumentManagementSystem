<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperless Rest DMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-800 font-sans antialiased flex flex-col">

<!-- Header -->
<header class="bg-indigo-600 text-white py-4 px-6 shadow flex justify-between items-center">
    <h1 class="text-lg font-bold tracking-wide">Paperless Rest DMS</h1>
    <button id="open-create-modal-btn" class="bg-white text-indigo-600 px-4 py-2 rounded font-semibold text-sm hover:bg-indigo-50 transition">
        + New Document
    </button>
</header>

<!-- Alerts -->
<div id="alert-container" class="max-w-7xl mx-auto w-full px-6 mt-4 hidden">
    <div id="alert-banner" class="p-4 rounded flex justify-between items-center bg-blue-50 border border-blue-100 text-blue-800">
        <div class="flex items-center space-x-2">
            <span id="alert-icon" class="text-lg font-bold">i</span>
            <p id="alert-message" class="text-sm"></p>
        </div>
        <button id="close-alert-btn" class="text-slate-500 hover:text-slate-800 font-bold">&times;</button>
    </div>
</div>

<!-- Main Grid Layout -->
<main class="max-w-7xl mx-auto w-full px-6 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">

    <!-- Left Column: Document List -->
    <div class="lg:col-span-2 bg-white rounded-lg shadow p-4 border border-slate-100 flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-base font-bold text-slate-950">Documents</h2>
            <input type="text" id="search-input" placeholder="Search title, filename, status..." class="border border-slate-300 rounded px-3 py-1.5 text-sm focus:outline-indigo-500" />
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full text-sm text-left">
                <thead>
                <tr class="bg-slate-100 text-slate-600 font-semibold border-b">
                    <th class="px-4 py-2">Details</th>
                    <th class="px-4 py-2">Specs</th>
                    <th class="px-4 py-2">Status</th>
                    <th class="px-4 py-2 text-right">Actions</th>
                </tr>
                </thead>
                <tbody id="documents-tbody" class="divide-y divide-slate-100">
                <tr>
                    <td colspan="4" class="px-4 py-8 text-center text-slate-400">Loading documents...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Right Column: Details & Lifecycle Log -->
    <div class="lg:col-span-1">
        <!-- Active Details -->
        <div id="details-panel" class="bg-white rounded-lg shadow p-5 border border-slate-100 hidden sticky top-6">
            <div class="flex justify-between items-start border-b pb-3 mb-4">
                <div>
                    <h3 id="details-title" class="text-base font-bold text-slate-900">-</h3>
                    <p id="details-uploaded-at" class="text-xs text-slate-400 mt-1">-</p>
                </div>
                <button id="close-details-btn" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
            </div>

            <div class="space-y-2 text-xs text-slate-600 bg-slate-50 p-3 rounded mb-4">
                <div><strong>File:</strong> <span id="details-filename" class="font-mono text-slate-800">-</span></div>
                <div><strong>Type:</strong> <span id="details-type" class="text-slate-800">-</span></div>
                <div><strong>Size:</strong> <span id="details-size" class="text-slate-800">-</span></div>
                <div class="flex items-center space-x-2"><strong>Status:</strong> <span id="details-status-badge">-</span></div>
            </div>

            <!-- Transitions Panel -->
            <div id="transition-section" class="border-b pb-4 mb-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Actions</h4>
                <div id="transition-buttons" class="flex flex-wrap gap-2"></div>

                <div id="transition-comment-wrapper" class="hidden mt-3 space-y-2">
                    <label class="block text-xs text-slate-500">Add a transition comment:</label>
                    <textarea id="transition-comment" rows="2" class="w-full text-xs border rounded p-2 focus:outline-indigo-500" placeholder="Optional comment..."></textarea>
                    <div class="flex justify-end space-x-2">
                        <button id="cancel-transition-btn" class="px-3 py-1 border rounded text-xs hover:bg-slate-50">Cancel</button>
                        <button id="submit-transition-btn" class="px-3 py-1 bg-indigo-600 text-white rounded text-xs font-semibold">Apply</button>
                    </div>
                </div>
            </div>

            <!-- History Log -->
            <div>
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">History Log</h4>
                <ul id="history-timeline" class="space-y-3 text-xs"></ul>
            </div>
        </div>

        <!-- Placeholder -->
        <div id="details-placeholder" class="bg-white rounded-lg shadow p-10 border border-slate-100 text-center text-slate-400">
            <p class="text-sm">Select a document to manage its status and view history log.</p>
        </div>
    </div>
</main>

<!-- Create Modal -->
<div id="create-modal" class="fixed inset-0 bg-slate-800/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6 relative">
        <button id="close-create-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-lg">&times;</button>
        <h3 class="text-lg font-bold mb-4">Create Document</h3>

        <form id="create-document-form" class="space-y-3 text-sm">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Title *</label>
                <input type="text" id="create-title" required class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">File Name</label>
                <input type="text" id="create-filename" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Content Type</label>
                    <input type="text" id="create-type" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Size (Bytes)</label>
                    <input type="number" id="create-size" min="0" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <button type="button" id="cancel-create-btn" class="px-4 py-2 border rounded font-semibold hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded font-semibold">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="fixed inset-0 bg-slate-800/50 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-6 relative">
        <button id="close-edit-modal-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-lg">&times;</button>
        <h3 class="text-lg font-bold mb-4">Edit Metadata</h3>

        <form id="edit-document-form" class="space-y-3 text-sm">
            <input type="hidden" id="edit-id" />
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Title *</label>
                <input type="text" id="edit-title" required class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">File Name</label>
                <input type="text" id="edit-filename" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Content Type</label>
                    <input type="text" id="edit-type" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Size (Bytes)</label>
                    <input type="number" id="edit-size" min="0" class="w-full border rounded px-3 py-2 focus:outline-indigo-500" />
                </div>
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <button type="button" id="cancel-edit-btn" class="px-4 py-2 border rounded font-semibold hover:bg-slate-50">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded font-semibold">Update</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
